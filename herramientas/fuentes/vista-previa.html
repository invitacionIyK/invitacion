<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 300 700; src: url("../../assets/fonts/cormorant-garamond-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 300 700; src: url("../../assets/fonts/cormorant-garamond-italic.woff2") format("woff2"); }
    @font-face { font-family: "Jost"; font-weight: 400 700; src: url("../../assets/fonts/jost-normal.woff2") format("woff2"); }

    * { box-sizing: border-box; margin: 0; }

    body {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(ellipse at 30% 40%, #3d5242 0%, #25362e 70%, #1c2b25 100%);
      color: #e6dfcf;
      font-family: "Cormorant Garamond", serif;
    }

    .marco {
      position: absolute;
      top: 22px;
      right: 22px;
      bottom: 22px;
      left: 22px;
      border: 1px solid rgba(211, 188, 132, 0.4);
    }

    .marco::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      bottom: 8px;
      left: 8px;
      border: 1px solid rgba(211, 188, 132, 0.18);
    }

    .sobre {
      position: absolute;
      top: 28px;
      left: 130px;
      height: 574px;
      width: auto;
    }

    .texto {
      position: absolute;
      top: 0;
      right: 70px;
      bottom: 0;
      left: 640px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .adorno {
      width: 70px;
      height: 1px;
      margin: 26px auto;
      background: #b9a46f;
    }

    .noticia {
      color: #f1ead8;
      font-size: 76px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.08;
    }

    .pista {
      color: #d9c79e;
      font-family: "Jost", sans-serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="marco"></div>
  <img class="sobre" src="sobre-captura.png" alt="">
  <div class="texto">
    <p class="noticia">Tenemos una gran noticia</p>
    <div class="adorno"></div>
    <p class="pista">Abre el sobre</p>
  </div>
</body>
</html>
