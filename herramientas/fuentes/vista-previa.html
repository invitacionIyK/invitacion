<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 300 700; src: url("../../assets/fonts/cormorant-garamond-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 300 700; src: url("../../assets/fonts/cormorant-garamond-italic.woff2") format("woff2"); }
    @font-face { font-family: "Jost"; font-weight: 400 700; src: url("../../assets/fonts/jost-normal.woff2") format("woff2"); }

    * { box-sizing: border-box; margin: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(ellipse at 28% 45%, #fffef9 0%, #f6f2e6 70%, #ece6d4 100%);
      color: #35402d;
      font-family: "Cormorant Garamond", serif;
    }

    .marco {
      position: absolute;
      top: 22px;
      right: 22px;
      bottom: 22px;
      left: 22px;
      border: 1px solid #c9b98d;
    }

    .marco::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      bottom: 8px;
      left: 8px;
      border: 1px solid rgba(201, 185, 141, 0.45);
    }

    .foto {
      position: absolute;
      top: 95px;
      left: 95px;
      width: 440px;
      height: 440px;
      border: 10px solid #eeeede;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 18px 40px rgba(53, 64, 45, 0.18);
    }

    .texto {
      position: absolute;
      top: 0;
      right: 70px;
      bottom: 0;
      left: 620px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .etiqueta {
      color: #98845c;
      font-family: "Jost", sans-serif;
      font-size: 17px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .adorno {
      width: 70px;
      height: 1px;
      margin: 22px auto;
      background: #b9a46f;
    }

    .nombres {
      font-style: italic;
      font-weight: 500;
      font-size: 82px;
      line-height: 1.05;
      color: #35402d;
    }

    .nombres span {
      display: block;
      color: #98845c;
      font-size: 54px;
    }

    .fecha {
      font-size: 34px;
      font-weight: 500;
      color: #4b5544;
    }

    .lugar {
      margin-top: 8px;
      font-size: 26px;
      font-weight: 500;
      color: #776c58;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="marco"></div>
  <img class="foto" src="../../assets/img/hero.jpg" alt="">
  <div class="texto">
    <p class="etiqueta">Nos casamos</p>
    <div class="adorno"></div>
    <p class="nombres">Ivan<span>&amp;</span>Katherine</p>
    <div class="adorno"></div>
    <p class="fecha">13 de febrero de 2027</p>
    <p class="lugar">Santa Bárbara de Heredia, Costa Rica</p>
  </div>
</body>
</html>
