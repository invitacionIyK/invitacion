<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <filter id="papel" filterUnits="userSpaceOnUse" x="0" y="0" width="520" height="520" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="diente"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.55" numOctaves="2" seed="23" result="fibraV"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.5 0.03" numOctaves="2" seed="37" result="fibraH"/>
    <feComposite in="diente" in2="fibraV" operator="arithmetic" k1="0" k2="0.9" k3="0.1" k4="0" result="mezcla"/>
    <feComposite in="mezcla" in2="fibraH" operator="arithmetic" k1="0" k2="1" k3="0.08" k4="0" result="altura"/>
    <feDiffuseLighting in="altura" surfaceScale="0.75" diffuseConstant="1.12" lighting-color="#fffdf6" result="luz">
      <feDistantLight azimuth="225" elevation="60"/>
    </feDiffuseLighting>
    <feColorMatrix in="diente" type="matrix" values="0 0 0 0 0.975  0 0 0 0 0.955  0 0 0 0 0.91  0 0 0 0 1" result="base"/>
    <feBlend in="luz" in2="base" mode="multiply"/>
  </filter>
  <rect width="520" height="520" filter="url(#papel)"/>
</svg>
